services:
  app:
    # Deploy the image the pipeline built, scanned and pushed (no rebuild on the server).
    image: docker.io/mohamedhafour/user-profile-app:latest
    container_name: user-profile-app
    restart: unless-stopped
    # Not published on the host any more: nginx is the public entry point and
    # reaches the app over the internal network. (Add `ports: ["3000:3000"]`
    # back if you want direct access to the app while debugging.)
    expose:
      - "3000"
    environment:
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOSTNAME: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      PORT: ${PORT}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mongo-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo-network

  # Frontend: nginx serving the static UI and proxying /api and /health to `app`.
  # Static files and nginx config are baked into this image (built from ./frontend
  # by the pipeline), so there is nothing to mount. No depends_on on purpose: the
  # frontend does not need the backend to start.
  nginx:
    image: docker.io/mohamedhafour/user-profile-frontend:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mongo-network

networks:
  mongo-network:

volumes:
  mongo-data:
