# PRIVATE server 1: app copy #1 + MongoDB. No public IP; nginx (public subnet) reaches
# the app on port 3000, and the app on private server 2 reaches MongoDB on port 27017.
services:
  app:
    # APP_TAG is set in .env by the Jenkins pipeline (update-private.sh); latest if absent.
    image: docker.io/mohamedhafour/user-profile-app:${APP_TAG:-latest}
    container_name: user-profile-app
    restart: unless-stopped
    ports:
      # Only on this server's private address.
      - "${PRIVATE1_IP:?set PRIVATE1_IP in .env (private IP of this server)}:3000:3000"
    environment:
      MONGO_USERNAME: "${MONGO_USERNAME:?set in .env}"
      MONGO_PASSWORD: "${MONGO_PASSWORD:?set in .env}"
      MONGO_HOSTNAME: mongodb
      MONGO_PORT: 27017
      MONGO_DB: "${MONGO_DB:-my-db}"
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Healthy only when connected to MongoDB.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q '\"mongo\":\"connected\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      # Only on this server's private address (private server 2's app connects here).
      - "${PRIVATE1_IP:?set PRIVATE1_IP in .env (private IP of this server)}:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME:?set in .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?set in .env}"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
