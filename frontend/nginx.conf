# Frontend nginx: serves the static site and forwards API calls to the backend.
#
# "app" is the backend service name from docker-compose. Docker's embedded DNS
# (127.0.0.11) resolves it, and because the address sits in a variable nginx
# looks it up at request time. So the frontend starts fine even if the backend
# is down, and keeps working when the backend container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json text/plain;

    # Security headers. nginx does NOT inherit these into a location that defines
    # its own add_header, so don't add add_header inside the locations below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend address. The port must match the PORT the Node app listens on (.env).
    set $backend http://app:3000;

    # Shared proxy settings (inherited by the proxy locations below).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Answered by nginx itself; used by the container healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Backend ---
    location /api/ {
        proxy_pass $backend;
    }

    # App + MongoDB health (answered by the backend).
    location = /health {
        proxy_pass $backend;
    }

    # --- Frontend (static files) ---
    location / {
        try_files $uri $uri/ =404;
        # Always revalidate (ETag -> 304) so a new deploy is picked up immediately.
        expires -1;
    }
}
